<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18191b">
<meta name="description" content="Car-rillion: the daily car trivia game where rare answers drive you further down the track.">
<title>Car-rillion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@500;700&family=VT323&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: the whole page is the racetrack. A living world canvas fills the viewport; the trackside history board runs the long way down a rail on the left; pixel panels in Indianapolis Motor Speedway black, bronze-gold and cream float over the road. Single dark look by design. */
:root{
  color-scheme:dark;
  --night:#18191b;          /* IMS near-black */
  --panel:rgba(24,25,27,.52);
  --glass-hi:rgba(239,238,232,.14);
  --edge:#3b3a2c;           /* dark bronze */
  --edge-hi:#605937;
  --chalk:#efeee8;          /* IMS off-white */
  --dust:#b3b0a0;           /* IMS cream, dimmed */
  --sodium:#c9b77e;         /* Wing & Wheel gold, lifted for text */
  --sodium-dk:#817549;      /* Wing & Wheel gold */
  --flag-r:#c8102e; --flag-b:#0057b8; --flag-g:#00843d; --flag-y:#ffc72c;
  --railw:64px;
  --t0:#d6dce6; --t1:#ffd23f; --t2:#38dc75; --t3:#b866ff; --t4:#ff5a36;
  --miss:#5b6680; --bad:#ff6b6b; --cyan:#7fd8ff;
  --f-pix:"Press Start 2P","Courier New",monospace;
  --f-head:"Pixelify Sans","Trebuchet MS",sans-serif;
  --f-body:"VT323","Courier New",monospace;
  --notch:polygon(0 6px,3px 6px,3px 3px,6px 3px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 3px,calc(100% - 3px) 3px,calc(100% - 3px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 3px) calc(100% - 6px),calc(100% - 3px) calc(100% - 3px),calc(100% - 6px) calc(100% - 3px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 3px),3px calc(100% - 3px),3px calc(100% - 6px),0 calc(100% - 6px));
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--night);color:var(--chalk);font:22px/1.15 var(--f-body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
@media (max-width:600px){:root{--railw:50px}}
canvas#world{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.crt{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 80% 70% at 50% 38%,transparent 55%,rgba(6,9,18,.6) 100%),
             repeating-linear-gradient(0deg,rgba(0,0,0,.09) 0 1px,transparent 1px 3px)}
.shell{position:relative;z-index:1;max-width:780px;margin:0 auto;padding-bottom:70px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sodium);outline-offset:2px}
.px{background:linear-gradient(160deg,rgba(239,238,232,.07),rgba(239,238,232,0) 40%),var(--panel);clip-path:var(--notch);box-shadow:inset 0 0 0 2px var(--glass-hi),inset 0 3px 0 rgba(239,238,232,.08);padding:18px 20px;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.px .eyebrow,.px .hint,.px .fb,.px .glabel{color:#d6d3c4}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:14px 0;flex-wrap:wrap}
.brand{background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand b{display:flex;align-items:center;gap:8px;font:20px/1 var(--f-pix);color:var(--chalk);letter-spacing:.02em;text-shadow:3px 3px 0 #000}
.brand .flags{display:inline-flex;gap:2px;align-items:flex-end;height:18px}
.brand .flags i{display:block;width:5px;height:14px;transform:skewX(-14deg)}
.brand .flags i:nth-child(1){background:var(--flag-r);height:11px}.brand .flags i:nth-child(2){background:var(--flag-b);height:15px}
.brand .flags i:nth-child(3){background:repeating-conic-gradient(#111 0 25%,#f2f2f2 0 50%) 0 0/4px 4px;height:18px}
.brand .flags i:nth-child(4){background:var(--flag-g);height:15px}.brand .flags i:nth-child(5){background:var(--flag-y);height:11px}
.brand b em{font-style:normal;color:var(--sodium)}
.brand span{font:18px/1 var(--f-body);color:var(--chalk);text-shadow:2px 2px 0 #000;opacity:.85;letter-spacing:.12em}
nav{display:flex;gap:6px;flex-wrap:wrap}
.nb{background:var(--panel);border:0;clip-path:var(--notch);box-shadow:inset 0 0 0 3px var(--edge);padding:8px 12px 7px;font:10px/1 var(--f-pix);color:var(--dust);cursor:pointer;letter-spacing:.04em}
.nb:hover{color:var(--chalk);box-shadow:inset 0 0 0 3px var(--edge-hi)}
.nb[aria-current="true"]{background:var(--sodium-dk);color:#fff;box-shadow:inset 0 0 0 3px var(--sodium)}
.acct{display:flex;align-items:center;gap:8px;background:var(--panel);border:0;clip-path:var(--notch);box-shadow:inset 0 0 0 3px var(--sodium-dk);padding:5px 10px 4px;cursor:pointer;font:20px/1 var(--f-body);color:var(--chalk)}
.acct img{width:22px;height:22px;image-rendering:auto}
.acct .nm{max-width:12ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct b{font:11px/1 var(--f-pix);color:var(--sodium)}.acct b small{font-size:8px;margin-left:3px;color:var(--dust)}
main.enter{animation:enter .18s steps(3)}
@keyframes enter{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}

/* HUD */
.hud{display:flex;justify-content:flex-end;margin-top:10px}
.odo{text-align:right;text-shadow:3px 3px 0 #000}
.odo b{display:block;font:26px/1 var(--f-pix);color:var(--chalk);font-variant-numeric:tabular-nums}
.odo b small{font-size:12px;margin-left:4px;color:var(--sodium)}
.odo .zone{display:block;font:20px/1.1 var(--f-body);color:var(--sodium);margin-top:6px;text-transform:uppercase;letter-spacing:.08em}
.odo .mode{display:block;font:18px/1.1 var(--f-body);color:var(--chalk);opacity:.8;letter-spacing:.08em}
.road-gap{height:max(170px,calc(34vh - 60px))}

/* trackside board: a quiet caption along the bottom of the screen, no box */
.rail{position:fixed;left:0;right:0;bottom:0;z-index:2;pointer-events:none;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to top,rgba(10,10,12,.55),rgba(10,10,12,0))}
.rail .inner{max-width:980px;margin:0 auto;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;text-shadow:0 1px 2px #000,0 0 8px rgba(0,0,0,.8)}
.rail .chk{display:none}
.rail .yr{font:13px/1 var(--f-pix);color:var(--sodium);opacity:.9;white-space:nowrap}
.rail .yr small{font-size:7px;margin-left:2px}
.rail p{margin:0;font-size:20px;line-height:1.1;color:var(--chalk);opacity:.82;flex:1;min-width:0}
.rail .next{font-size:16px;color:var(--dust);opacity:.7;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.rail.flash p,.rail.flash .yr{animation:capflash 1.2s ease}
@keyframes capflash{0%{opacity:0;transform:translateY(4px)}100%{opacity:.85;transform:none}}
@media (max-width:600px){.rail p{font-size:17px}.rail .next{display:none}}

/* common */
.eyebrow{font:10px/1.5 var(--f-pix);color:var(--dust);letter-spacing:.06em;text-transform:uppercase}
h1,h2,h3{text-wrap:balance}
.btn{border:0;clip-path:var(--notch);padding:14px 18px 12px;font:13px/1 var(--f-pix);cursor:pointer;text-transform:uppercase;letter-spacing:.02em;box-shadow:inset -4px -4px 0 #0005,inset 4px 4px 0 #fff4}
.btn:active{transform:translateY(2px);box-shadow:inset 4px 4px 0 #0005}
.btn small{display:block;font:18px/1 var(--f-body);text-transform:none;margin-top:6px;opacity:.8;letter-spacing:0}
.go{background:var(--sodium-dk);color:#fff}
.buy{background:#2a2a1e;color:var(--sodium);box-shadow:inset 0 0 0 3px var(--sodium-dk)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:rgba(239,238,232,.1);color:var(--chalk)}
.mini{border:0;clip-path:var(--notch);padding:7px 10px 6px;font:9px/1 var(--f-pix);cursor:pointer;text-transform:uppercase}
.cta{display:flex;gap:10px;flex-wrap:wrap}

/* home */
.hero h1{font:clamp(26px,7vw,46px)/1.15 var(--f-pix);margin:10px 0 14px;text-shadow:4px 4px 0 #000}
.hero h1 i{font-style:normal;color:var(--sodium)}
.lede{font-size:24px;line-height:1.1;margin:0 0 18px;max-width:46ch}
.lede em{font-style:normal;color:var(--sodium)}
.tiers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:20px}
.tier{border-top:6px solid var(--c);padding-top:6px}
.tier b{display:block;font:9px/1.4 var(--f-pix);color:var(--c);text-transform:uppercase}
.tier span{font-size:19px;color:var(--dust)}
@media (max-width:560px){.tiers{grid-template-columns:repeat(2,minmax(0,1fr))}.tier:last-child{grid-column:1/-1}}
.meta{margin-top:14px;font-size:19px;color:var(--dust)}

/* play */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pips{display:flex;gap:4px}
.pip{width:18px;height:10px;background:#2a3346}
.pip.now{background:var(--chalk);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{background:#2a3346}}
.prompt{font:700 clamp(26px,5.5vw,38px)/1.05 var(--f-head);margin:12px 0 14px;letter-spacing:.01em}
.gauge{height:16px;background:rgba(8,8,10,.4);box-shadow:inset 0 0 0 2px var(--glass-hi);padding:4px}
.gauge i{display:block;height:100%;width:100%;transform-origin:left;background:repeating-linear-gradient(90deg,var(--sodium) 0 10px,transparent 10px 12px)}
.gauge.low i{background:repeating-linear-gradient(90deg,var(--bad) 0 10px,transparent 10px 12px);animation:blink2 .5s steps(2) infinite}
@keyframes blink2{50%{opacity:.5}}
.glabel{display:flex;justify-content:space-between;font-size:19px;color:var(--dust);margin-top:4px;font-variant-numeric:tabular-nums}
form.ans{display:flex;gap:8px;margin-top:14px}
form.ans input{flex:1;min-width:0;background:rgba(8,8,10,.5);border:0;clip-path:var(--notch);box-shadow:inset 0 0 0 2px var(--glass-hi);padding:12px 14px 10px;font:26px/1 var(--f-body);color:var(--chalk);caret-color:var(--sodium)}
form.ans input:focus{outline:none;box-shadow:inset 0 0 0 3px var(--sodium)}
form.ans.shake{animation:shake .32s steps(4)}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.fb{min-height:26px;margin-top:8px;font-size:21px;color:var(--dust)}
.fb.bad{color:var(--bad)}
.suggest{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding:8px 10px;background:#0f2230;box-shadow:inset 0 0 0 2px #2c6b8a;font-size:21px}
.suggest b{color:var(--cyan);font-weight:400}
.suggest .yes{background:var(--cyan);color:#06202c}
.suggest .no{background:#202a3d;color:var(--chalk)}
.sub{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
.link{background:none;border:0;color:var(--dust);cursor:pointer;font:20px var(--f-body);text-decoration:underline;text-underline-offset:3px;padding:2px 0}
.link:hover{color:var(--chalk)}

/* verdict (no answer list during play) */
.verdict{margin:6px 0 4px;padding:18px 16px;background:rgba(8,8,10,.35);clip-path:var(--notch);box-shadow:inset 0 0 0 3px var(--c)}
.verdict .word{font:clamp(24px,7vw,40px)/1.05 var(--f-pix);color:var(--c);text-shadow:3px 3px 0 #000;text-transform:uppercase}
.verdict .word.gem{background:repeating-conic-gradient(var(--t4) 0 25%,#ffd0c2 0 50%) 0 0/10px 10px;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(3px 3px 0 #000)}
.verdict .flav{font-size:22px;color:var(--dust);margin-top:8px}
.verdict .yours{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:22px}
.verdict .yours b{font-weight:400;color:var(--chalk)}
.verdict .yours span{color:var(--dust)}
.hint{font-size:19px;color:var(--dust);margin:10px 0 0}
.nextrow{display:flex;justify-content:flex-end;margin-top:14px}
.badge{font:9px/1 var(--f-pix);text-transform:uppercase;padding:7px 8px 6px;background:var(--c);color:#0a0d14;white-space:nowrap}
.badge.gem{background:repeating-conic-gradient(var(--t4) 0 25%,#ffd0c2 0 50%) 0 0/8px 8px;text-shadow:1px 1px 0 #fff}
.toast{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-height:30px;margin-top:10px;font-size:21px;color:var(--dust)}
.last{margin-top:12px;padding-top:10px;border-top:3px dashed #2a3346;font-size:20px;color:var(--dust);line-height:1.1}
.last b{color:var(--chalk);font-weight:400}

/* end */
.end h2{font:clamp(30px,9vw,54px)/1 var(--f-pix);margin:10px 0 2px;text-shadow:4px 4px 0 #000;font-variant-numeric:tabular-nums}
.end h2 small{font-size:.38em;color:var(--sodium);margin-left:6px;text-shadow:none}
.end .score{font-size:22px;color:var(--cyan);letter-spacing:.06em;text-transform:uppercase}
.sect{display:flex;align-items:center;gap:10px;margin:22px 0 8px;font:10px/1 var(--f-pix);color:var(--dust);letter-spacing:.08em;text-transform:uppercase}
.sect::after{content:"";flex:1;border-top:2px dashed #2f3a52}
.log{width:100%;height:auto;display:block;overflow:visible}
.bearing{display:grid;gap:0}
.bearing div{display:grid;grid-template-columns:14px 92px 1fr;gap:12px;align-items:center;padding:8px 4px;border-bottom:1px solid #222c40;font-size:20px;color:var(--dust)}
.bearing div i{width:12px;height:12px;background:var(--c);display:block}
.bearing div code{font:10px/1 var(--f-pix);color:var(--c)}
.bearing div.me{color:var(--chalk);background:#ffffff0d}
.recap{display:grid;gap:6px}
details.rc{background:rgba(8,8,10,.35);box-shadow:inset 0 0 0 1px var(--glass-hi)}
details.rc summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:9px 12px;font-size:20px;line-height:1.05}
details.rc summary::-webkit-details-marker{display:none}
details.rc summary i{width:12px;height:12px;background:var(--c);display:block}
details.rc summary span{min-width:0;color:var(--dust)}
details.rc summary span b{color:var(--chalk);font-weight:400}
details.rc summary em{font-style:normal;font:9px/1 var(--f-pix);color:var(--c);white-space:nowrap;text-align:right}
details.rc summary em small{display:block;font:17px/1 var(--f-body);color:var(--dust);margin-top:4px}
details.rc[open] summary{box-shadow:inset 0 -2px 0 #232d43}
details.rc .inner{padding:10px 12px 12px}
.board{display:grid;gap:10px}
.method{font-size:18px;color:var(--dust);margin:0 0 10px}
.row{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:start}
.row h4{margin:2px 0 0;font:9px/1.4 var(--f-pix);color:var(--c);text-transform:uppercase}
.row h4 small{display:block;font:17px/1 var(--f-body);color:var(--dust);text-transform:none;margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.chip{font-size:19px;line-height:1;padding:4px 7px 3px;background:rgba(8,8,10,.45);box-shadow:inset 0 0 0 1px var(--glass-hi);color:var(--chalk)}
.chip.mine{background:var(--c);color:#0a0d14;box-shadow:none}
.chip.gemc{box-shadow:inset 0 0 0 2px var(--t4);color:var(--t4)}
.chip.gemc.mine{color:#0a0d14}
.chip em{font-style:normal;font-size:15px;color:var(--dust);margin-left:4px;text-transform:uppercase}
.chip.mine em{color:#0a0d14}
@media (max-width:520px){.row{grid-template-columns:1fr}.bearing div{grid-template-columns:14px 80px 1fr}}
.share{width:100%;min-height:76px;background:rgba(8,8,10,.5);border:0;box-shadow:inset 0 0 0 2px var(--glass-hi);color:var(--chalk);padding:10px 12px;font:22px/1.1 var(--f-body);resize:none}
.stats{display:flex;gap:20px;flex-wrap:wrap;margin:8px 0 6px}
.stat b{display:block;font:16px/1.2 var(--f-pix);font-variant-numeric:tabular-nums}
.stat span{font-size:18px;color:var(--dust);text-transform:uppercase}
.how ol{padding-left:24px;margin:10px 0 0;display:grid;gap:8px;max-width:58ch;font-size:22px;line-height:1.1}
.how h2{font:18px/1.3 var(--f-pix);margin:8px 0 6px}
.faq{max-width:60ch}
.faq h3{font:11px/1.5 var(--f-pix);color:var(--sodium);margin:16px 0 4px;text-transform:uppercase}
.faq p{margin:0;font-size:21px;line-height:1.12}
.earned{font-size:21px;color:var(--chalk);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.gt{font:16px/1.3 var(--f-pix);margin:8px 0 10px}
.wallet{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:8px 0}
.wallet b{display:block;font:16px/1.2 var(--f-pix);color:var(--sodium);font-variant-numeric:tabular-nums}
.wallet span{font-size:18px;color:var(--dust)}
@media (max-width:560px){.wallet{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:12px}
.car{display:grid;grid-template-rows:auto 1fr auto;gap:8px;background:rgba(239,238,232,.06);box-shadow:inset 0 0 0 1px var(--glass-hi);padding:12px;clip-path:var(--notch)}
.car.on{box-shadow:inset 0 0 0 3px var(--sodium)}
.car .pic{height:96px;display:grid;place-items:center;background:rgba(8,8,10,.35)}
.carpix{image-rendering:pixelated;max-width:100%}
.car .info b{display:block;font:10px/1.4 var(--f-pix);color:var(--chalk)}
.car .info span{font-size:18px;color:var(--dust);line-height:1.05}
.car .btn{font-size:10px;padding:11px 10px 9px}
.lbt{display:grid;gap:2px}
.lbh,.lbr{display:grid;grid-template-columns:52px 1fr 90px 100px 60px;gap:8px;align-items:center;padding:6px 8px}
.lbh{font:9px/1 var(--f-pix);color:var(--dust);text-transform:uppercase}
.lbr{background:rgba(239,238,232,.06);font-size:20px;font-variant-numeric:tabular-nums}
.lbr.me{box-shadow:inset 3px 0 0 var(--sodium);background:#2a2920}
.lbr .who{display:flex;align-items:center;gap:8px;min-width:0}
.lbr .who img{width:22px;height:22px}
.lbr .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:560px){.lbh,.lbr{grid-template-columns:40px 1fr 70px}.lbh span:nth-child(n+4),.lbr span:nth-child(n+4){display:none}}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 4px}
.tools input[type=search]{flex:1;min-width:180px;background:rgba(8,8,10,.5);border:0;box-shadow:inset 0 0 0 2px var(--glass-hi);padding:9px 10px 7px;font:20px/1 var(--f-body);color:var(--chalk)}
.tools .btn{font-size:10px;padding:11px 12px 9px}
.sheet code{font-family:var(--f-body);color:var(--sodium)}
.slist{display:grid;gap:2px;margin-top:10px}
.shead,.shit{display:grid;grid-template-columns:42px 1fr 70px 150px;gap:10px;align-items:center;padding:7px 8px;text-align:left}
.shead{font:9px/1 var(--f-pix);color:var(--dust);text-transform:uppercase}
.shit{width:100%;background:rgba(239,238,232,.06);border:0;cursor:pointer;font-size:19px;color:var(--chalk)}
.shit:hover{background:#2a2920}
.shit b{font-weight:400;display:block}.shit small{font-size:16px;color:var(--dust)}
.shit span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.srow.open .shit{background:#2a2920;box-shadow:inset 3px 0 0 var(--sodium)}
@media (max-width:560px){.shead,.shit{grid-template-columns:34px 1fr 50px}.shead span:nth-child(4),.shit span:nth-child(4){display:none}}
.sedit{background:rgba(8,8,10,.45);padding:12px;box-shadow:inset 3px 0 0 var(--sodium)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.sgrid label{display:grid;gap:4px;font:9px/1.4 var(--f-pix);color:var(--dust);text-transform:uppercase;min-width:0}
.sgrid .wide{grid-column:1/-1}
.sgrid .tn{color:var(--c,var(--dust))}

function makeSprite(def){

let grassPat=null, asphPat=null;
function makeTex(size, block, fn){
  const s = Math.round(size*DPR), b = Math.max(1,Math.round(block*DPR));

function resize(){
  DPR = Math.min(innerWidth > 1300 ? 1 : 1.25, window.devicePixelRatio||1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  P = W < 640 ? 3 : 4; K = W < 640 ? 1.8 : 2.2;
  CY = Math.round(H*0.27);

}
addEventListener("resize", resize);
const WX = [];
function initWX(){
  WX.length = 0; const R=Math.random;
  for (let i=0;i<150;i++) WX.push({k:"rain", x:R()*W, y:R()*H, vx:-160, vy:720+R()*320, ph:0});
  for (let i=0;i<100;i++) WX.push({k:"snow", x:R()*W, y:R()*H, vx:-10+R()*20, vy:34+R()*40, ph:R()*6, s:R()<.3?3:2});
  for (let i=0;i<40;i++)  WX.push({k:"leaves", x:R()*W, y:R()*H, vx:-20+R()*40, vy:36+R()*36, ph:R()*6, c:["217,130,43","184,69,44","242,193,78","168,67,42"][i%4]});
}
function stepWX(dt, now, camShift){
  for (const w of WX){
    w.x += (w.vx + (w.k==="rain"?0:Math.sin(now/700+w.ph)*18))*dt;
    w.y += w.vy*dt - camShift;
    if (w.y > H+24){ w.y = -20; w.x = Math.random()*W; }
    if (w.y < -30){ w.y = H+10; w.x = Math.random()*W; }
    if (w.x < -10) w.x += W+20; if (w.x > W+10) w.x -= W+20;

/* --- world helpers --- */
let camTop = 0;
const sy = m => m*K - camTop;
function ptAt(m){
  const x = cx(m), y = sy(m), dx = (cx(m+1)-cx(m-1))/2, len = Math.hypot(dx,K);
  return {m, x, y, tx:dx/len, ty:K/len, nx:K/len, ny:-dx/len};
}
const off = (p,d) => [p.x+p.nx*d, p.y+p.ny*d];

function person(x,y,shirt,bob,arm){
  const s=P*0.75;

  ctx.fillStyle=shirt; ctx.fillRect(x, y+s-bob, s, s*2);

const SHIRTS = ["#d9473b","#f2c94c","#4f8fe0","#eef1f6","#38b26a","#b866ff","#ff8f3d","#22262e"];

function flag(x,y,len,col,t,ph,check){
  ctx.strokeStyle="#c9ccd4"; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y-len); ctx.stroke();

  ctx.beginPath(); ctx.moveTo(x,top);
  for (let i=1;i<=n;i++){ const u=i/n; ctx.lineTo(x+u*fw, top + Math.sin(t*5+ph-u*3)*fh*0.25*u); }
  for (let i=n;i>=0;i--){ const u=i/n; ctx.lineTo(x+u*fw, top+fh + Math.sin(t*5+ph-u*3)*fh*0.25*u); }
  ctx.closePath();
  if (check){ ctx.save(); ctx.clip(); const c=Math.max(2,fh/3); for (let yy=0;yy<3;yy++) for (let xx=0;xx*c<fw+c;xx++){ ctx.fillStyle=(xx+yy)%2?"#111":"#f2f2f2"; ctx.fillRect(x+xx*c, top-fh*.3+yy*c+(fh*.3), c, c);} ctx.restore(); }

function pts0(a,b){ const o=[]; for (let m=Math.floor(a/3)*3; m<=b; m+=3) o.push(ptAt(m)); return o; }
/* --- glow sprites: radial gradients are built once per colour, then stamped --- */
const GLOW = new Map();

  const gr = g.createRadialGradient(32,32,0,32,32,32); gr.addColorStop(0,`rgba(${col},1)`); gr.addColorStop(1,`rgba(${col},0)`);

let LIGHTS = [];
const light = (x,y,r,col,a) => LIGHTS.push([x,y,r,col,a]);

function render(t){

  for (let n=Math.floor(mTop/18); n*18<mBot; n++){
    const z=zoneAt(n*18); if (z.dark<.35 || z.salt>.5) continue;
    for (let k=0;k<2;k++){ const h=hash(n,k+90); const x=(h%1000)/1000*W, y=sy(n*18)+(h>>>10)%30 + Math.sin(T*0.8+k)*6; if (Math.abs(x-cx(n*18))<RW/2+KB+20) continue;
      const a=Math.max(0,Math.sin(T*2.2+(h%60)))**3; if (a>.05) light(x,y,10,"200,255,140",a*.9); }
  }
  // pit garages near the grid
  if (mTop < 260 && mBot > -200){
    for (let m=-160; m<240; m+=4){ if (m<mTop||m>mBot) continue; }
    const ps = -1, x0 = (mm)=>side(mm,ps,30)[0];
    for (let m=-160; m<240; m+=20){
      if (m+20<mTop || m>mBot) continue;
      const [xa,ya]=side(m,ps,30), w=72, h=20*K-2, x=xa-w;
      ctx.fillStyle="#3c4352"; ctx.fillRect(x, ya, w, h);
      ctx.fillStyle=["#c0392b","#2f6fb8","#f2c94c","#1e9e63","#eef1f6"][hash(m,3)%5]; ctx.fillRect(x+w-14, ya+3, 10, h-6);
      ctx.fillStyle="#262b36"; ctx.fillRect(x+w-16, ya+3, 2, h-6);
      ctx.fillStyle="#56607a"; ctx.fillRect(x, ya, w, 3);
      for (let k=0;k<2;k++){ const hh=hash(m,k); const ph=(hh%628)/100; person(x+w+4+(Math.sin(T*0.7+ph)*0.5+0.5)*10, ya+6+k*14, SHIRTS[hh%SHIRTS.length], 0, 0); }
    }
  }
  // harbour-front buildings
  for (let n=Math.floor(mTop/24); n*24<mBot; n++){
    const m=n*24, z=zoneAt(m); if (z.harbour<.5) continue;
    const h=hash(n,600), [xa,ya]=side(m,-1,22), bw=60+(h%50), bh=24*K-4, x=xa-bw;
    const fac=["#d9b48f","#e8d6b5","#c98a6a","#efe4cf","#b7c4c9","#e3a87a"][h%6];
    ctx.fillStyle="rgba(0,0,0,.28)"; ctx.fillRect(x+5,ya+5,bw,bh);
    ctx.fillStyle=fac; ctx.fillRect(x,ya,bw,bh);
    ctx.fillStyle="#9c5b3a"; ctx.fillRect(x,ya,bw,P);
    for (let wy=ya+P*2; wy<ya+bh-P*2; wy+=P*3) for (let wx=x+P*1.5; wx<x+bw-P*2; wx+=P*3){
      const lit = z.dark>.3 && hash(wx|0,wy|0)%3===0; ctx.fillStyle= lit?"#ffe6a0":"#3c4a5c"; ctx.fillRect(wx,wy,P*1.4,P*1.6); if (lit) light(wx,wy,14,"255,220,150",.5); }
    if (h%4===0){ ctx.fillStyle=["#c0392b","#2f6fb8","#1e9e63"][h%3]; ctx.beginPath(); ctx.moveTo(x+bw,ya+bh*.3); ctx.quadraticCurveTo(x+bw+8, ya+bh*.5, x+bw, ya+bh*.7); ctx.fill(); }
  }
  // grandstands with a moving crowd
  for (let n=Math.floor(mTop/70); n*70<mBot; n++){
    const m=n*70, z=zoneAt(m); if (z.stands<.2) continue;
    for (const s of [-1,1]){
      if (m>-170 && m<250 && s===-1) continue;
      const h=hash(n,s+7); if ((h%100)/100 > z.stands) continue;
      const [xa,ya]=side(m, s, 30); const w=Math.min(110, W*.16), hgt=48*K/2.2*1.0;
      const x = s<0 ? xa-w : xa;
      ctx.fillStyle="rgba(0,0,0,.25)"; ctx.fillRect(x+4,ya+4,w,hgt);
      ctx.fillStyle="#454c5c"; ctx.fillRect(x,ya,w,hgt);
      ctx.fillStyle="#353b48"; for (let r=0;r<hgt;r+=P*2.2) ctx.fillRect(x,ya+r,w,1);
      const rows=Math.floor((hgt-8)/(P*2.2)), cols=Math.floor((w-6)/(P*1.6));
      for (let r=0;r<rows;r++) for (let c=0;c<cols;c++){
        const hh=hash(n*131+c, r*7+s); if (hh%9===0) continue;
        const wave = (Math.sin(T*1.6 - c*0.35 + n) > 0.82);           // Mexican wave
        const bob = reduce?0:(wave ? P*.9 : ((hh%13===0 && Math.sin(T*6+hh)>.6) ? P*.5 : 0));
        person(x+3+c*P*1.6, ya+5+r*P*2.2, SHIRTS[hh%SHIRTS.length], bob, (hh%23===0)? (Math.sin(T*8+hh)>0?1:-1):0);
      }
      // curved roof
      ctx.fillStyle="#cfd3db"; ctx.beginPath(); ctx.moveTo(x-4,ya+4); ctx.quadraticCurveTo(x+w/2, ya-14, x+w+4, ya+4); ctx.lineTo(x+w+4, ya+8); ctx.quadraticCurveTo(x+w/2, ya-8, x-4, ya+8); ctx.closePath(); ctx.fill();
      flag(s<0?x+w-6:x+6, ya-4, 22, ["#d9473b","#2f6fb8","#f2c94c","#1e9e63"][h%4], T, n, h%5===0);
    }
  }
  // campers, tents and campfires
  for (let n=Math.floor(mTop/45); n*45<mBot; n++){
    const m=n*45, z=zoneAt(m); const h=hash(n,77); if ((h%100)/100 > z.camp) continue;
    const s = (h&1)?1:-1, [x,y]=side(m,s,60+(h>>>8)%60);
    if (x<-60||x>W+60) continue;
    ctx.fillStyle="rgba(0,0,0,.25)"; ctx.fillRect(x-2,y+P*5,P*12,P*1.4);
    if ((h>>>3)%3) spr((h>>>5)&1?"van":"van2", x, y); else spr((h>>>5)&1?"tent":"tent2", x, y);
    const fx = x + (s>0? -P*4 : P*15), fy = y+P*6;
    if (z.dark>.3){
      const fl = reduce?1:(0.75+0.25*Math.sin(T*13+h)+0.1*Math.sin(T*31));
      ctx.fillStyle="#ff9a2e"; ctx.fillRect(fx, fy-P*fl, P, P*fl); ctx.fillStyle="#ffd36b"; ctx.fillRect(fx+P*.25, fy-P*.5, P*.5, P*.5);
      light(fx, fy, 70*fl, "255,150,60", .8*z.dark);
      person(fx-P*2, fy-P, SHIRTS[h%8], 0, 0); person(fx+P*2, fy-P*1.2, SHIRTS[(h>>>4)%8], 0, 0);
    } else {
      person(fx, fy-P*2, SHIRTS[h%8], reduce?0:(Math.sin(T*3+h)>.7?P*.5:0), Math.sin(T*5+h)>0?1:-1);
    }
  }
  // vintage cars + gas lamps in history lane
  for (let n=Math.floor(mTop/32); n*32<mBot; n++){
    const m=n*32, z=zoneAt(m); if (z.vint<.4) continue;
    const h=hash(n,41), s=(h&1)?1:-1, [x,y]=side(m,s,36+(h>>>6)%40);
    spr((h>>>3)&1?"vintage":"vintage2", x, y);
    if (n%2===0){ const [lx,ly]=side(m+12,-s,26); ctx.fillStyle="#2a2a2a"; ctx.fillRect(lx,ly-18,2,18); ctx.fillStyle="#ffe7a3"; ctx.fillRect(lx-2,ly-22,6,5); light(lx+1,ly-20,40,"255,220,150",.35+z.dark); }
  }
  // salt flats: timing tents + dust devils
  for (let n=Math.floor(mTop/130); n*130<mBot; n++){
    const m=n*130, z=zoneAt(m); if (z.salt<.5 && z.sand<.5) continue;
    const h=hash(n,61);
    if (z.salt>.5){ const [tx,ty]=side(m, (h&1)?1:-1, 50); spr("timing", tx, ty); }
    const dx = ((h%1000)/1000)*W, dy = sy(m+130);
    if (!reduce){ ctx.strokeStyle="rgba(170,155,130,.45)"; ctx.lineWidth=1.5; ctx.beginPath();
      for (let k=0;k<24;k++){ const a=k*0.75 + T*5, r=2+k*1.1; const px=dx+Math.cos(a)*r + Math.sin(T*.5+n)*30, py=dy - k*2.4 + Math.sin(a)*r*.35; k?ctx.lineTo(px,py):ctx.moveTo(px,py); }
      ctx.stroke(); }
  }
  // billboards (fictional sponsors)
  const ADS=["APEX OIL","LATE BRAKE","GRIP & CO","TORQUE+","REDLINE","PIT CAFE","DOWNFORCE","CAR-RILLION"];
  ctx.font = `${Math.round(P*1.6)}px "Press Start 2P", monospace`; ctx.textBaseline="middle";
  for (let n=Math.floor(mTop/150); n*150<mBot; n++){
    const m=n*150+60, z=zoneAt(m); if (z.bill<.3 || hash(n,13)%10 > z.bill*10) continue;
    const s=(n&1)?1:-1, [x,y]=side(m,s,26), txt=ADS[hash(n,2)%ADS.length];
    const bw=ctx.measureText(txt).width+P*3, bh=P*5, bx=s<0?x-bw:x;
    ctx.fillStyle="#262b36"; ctx.fillRect(bx+P, y+bh, 2, P*2); ctx.fillRect(bx+bw-P-2, y+bh, 2, P*2);
    ctx.fillStyle=["#c0392b","#14335e","#1e6e4a","#f2c94c"][hash(n,4)%4]; ctx.fillRect(bx,y,bw,bh);
    ctx.fillStyle="#fff"; ctx.fillText(txt, bx+P*1.5, y+bh/2+1);
    if (z.dark>.3) light(bx+bw/2, y+bh/2, 40, "255,255,255", .25);
  }
  // marshal posts with waving flags
  for (let n=Math.floor(mTop/240); n*240<mBot; n++){
    const m=n*240+120, z=zoneAt(m); if (z.salt>.5) continue;
    const s=(n&1)?-1:1, [x,y]=side(m,s,28), hx = s<0? x-SPR.hut.w : x;
    spr("hut", hx, y);
    const mx = s<0 ? hx-P*2 : hx+SPR.hut.w+P;
    person(mx, y+P*2, "#ff8f3d", 0, 0);
    const ang = reduce?0:Math.sin(T*6+n)*0.9;
    ctx.save(); ctx.translate(mx+P, y+P*2); ctx.rotate(ang - Math.PI/2);
    ctx.strokeStyle="#ddd"; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(16,0); ctx.stroke();
    ctx.fillStyle = (n%3===0)?"#f2d33b":"#2fbf5f"; ctx.beginPath(); ctx.moveTo(16,0); ctx.quadraticCurveTo(22,4+Math.sin(T*9)*3,28,1); ctx.lineTo(28,9); ctx.quadraticCurveTo(22,12+Math.sin(T*9)*3,16,8); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  // light poles
  for (let n=Math.floor(mTop/70); n*70<mBot; n++){
    const m=n*70, z=zoneAt(m); if (z.dark<=.25) continue;
    const s=(n&1)?1:-1, [x,y]=side(m,s,8);
    ctx.fillStyle="#7d828c"; ctx.fillRect(x-1, y-26, 2, 26);
    ctx.strokeStyle="#7d828c"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x, y-26); ctx.quadraticCurveTo(x - s*4, y-32, x - s*12, y-30); ctx.stroke();
    ctx.fillStyle="#fff1c9"; ctx.fillRect(x - s*12 - 3, y-31, 6, 3);
    light(x - s*12, y-24, 120, "255,205,130", .7*z.dark);
  }
  // tyre stacks on the outside of bends
  for (let n=Math.floor(mTop/40); n*40<mBot; n++){
    const m=n*40, c=curv(m); if (Math.abs(c)<0.012) continue;
    const s = c>0 ? -1 : 1;
    for (let k=0;k<5;k++){ const [x,y]=side(m+k*2.4, s, 12); ctx.fillStyle="#16181d"; ctx.beginPath(); ctx.arc(x,y,P*1.4,0,Math.PI*2); ctx.fill(); ctx.strokeStyle=k%2?"#d0453a":"#eef0f3"; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(x,y,P*1.4-1,0,Math.PI*2); ctx.stroke(); }
  }
  // 100 m boards (left) and history boards (right)
  for (let m=Math.max(100,Math.ceil(mTop/100)*100); m<mBot; m+=100){
    if (FACTS.some(f=>Math.abs(f[0]-m)<14) || (m>=1880&&m<=2030)) continue;
    const s=String(m), dsz=2, w=s.length*4*dsz+4, [x,y]=side(m,-1,30);
    ctx.fillStyle="rgba(10,13,20,.85)"; ctx.fillRect(x-w, y-6, w, 5*dsz+6);
    digits(s, x-w+3, y-3, dsz, "#c9d0dc");
  }
  FACTS.forEach(([d],fi)=>{
    if (d<mTop||d>mBot) return;
    const dense = d>=1880 && d<=2030;                      // the year stretch: fan the signs out
    const s=String(d), dsz=dense?2:Math.max(2,P-1), w=s.length*4*dsz+dsz*3, h=5*dsz+dsz*4, passed=car.shown>=d;
    const sd = dense ? ((fi&1)?1:-1) : 1, od = dense ? 30 + (fi%4)*(w+10) : 30;
    let [x,y]=side(d,sd,od); if (sd<0) x -= w; const z=zoneAt(d);
    ctx.fillStyle="#6c707a"; ctx.fillRect(x+dsz, y, 2, 14); ctx.fillRect(x+w-dsz-2, y, 2, 14);
    ctx.fillStyle="rgba(0,0,0,.3)"; ctx.fillRect(x+3, y-h+3, w, h);
    ctx.fillStyle= passed?"#c9b77e":"#eceef2"; ctx.fillRect(x, y-h, w, h);
    ctx.fillStyle= passed?"#c47a14":"#9aa1ad"; ctx.fillRect(x, y-dsz, w, dsz);
    digits(s, x+dsz*1.5, y-h+dsz*1.5, dsz, "#11141c");
    if (z.dark>.25) light(x+w/2, y-h/2, 60, passed?"201,183,126":"255,255,255", .45);
  });
  // start gantry with lights
  if (mTop < 0 && mBot > -30){
    const p=ptAt(-14), [lx,ly]=off(p,-(RW/2+KB+6)), [rx,ry]=off(p,RW/2+KB+6);
    ctx.strokeStyle="#262b36"; ctx.lineWidth=8; ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(rx,ry); ctx.stroke();
    ctx.fillStyle="#262b36"; ctx.fillRect(lx-3,ly-3,6,10); ctx.fillRect(rx-3,ry-3,6,10);
    const onGrid = car.target===0 && car.shown===0, cyc = (T%6), lit = onGrid ? (cyc<4 ? Math.floor(cyc/0.8)+1 : 0) : 0;
    for (let i=0;i<5;i++){ const u=(i+1)/6, x=lerp(lx,rx,u), y=lerp(ly,ry,u); const on=i<lit; ctx.fillStyle=on?"#ff3b30":"#3a1515"; ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fill(); if (on) light(x,y,26,"255,60,40",.9); }
  }

  /* ---- the car ---- */
  const cm = car.shown, cp = ptAt(cm), [carX, carY] = off(cp, racing(cm));
  const ang = -Math.atan2((cx(cm+1)-cx(cm-1))/2, K) + (cp.y? 0:0);
  const moving = Math.abs(car.target-car.shown) > 0.5;
  const fwd = [-Math.sin(ang), Math.cos(ang)];
  const idleBob = reduce?0:Math.sin(T*38)*0.35;
  // puffs + speed lines (smooth)
  for (const p of puffs){ ctx.fillStyle=`rgba(210,214,222,${p.a*p.life})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill(); }
  if (moving && !reduce){
    ctx.strokeStyle="rgba(255,255,255,.28)"; ctx.lineWidth=1.5;
    for (let k=-2;k<=2;k++){ const ox=carX - fwd[1]*k*5, oy=carY + fwd[0]*k*5; const L=30+((T*400+k*37)%50); ctx.beginPath(); ctx.moveTo(ox - fwd[0]*24, oy - fwd[1]*24); ctx.lineTo(ox - fwd[0]*(24+L), oy - fwd[1]*(24+L)); ctx.stroke(); }
  }
  // headlights into the night
  const zc = zoneAt(cm);
  if (zc.dark>.15){
    LIGHTS.push(["cone", carX, carY+idleBob, ang, zc.dark]);
  }
  window.__car = {x:carX, y:carY, fwd};

  /* ---- grading overlays: warm, sepia, night ---- */
  const og = (fn) => { const g=ctx.createLinearGradient(0,0,0,H); for (let y=-60;y<=H+60;y+=40){ g.addColorStop(clamp(y/H,0,1), fn(zoneAt((y+camTop)/K))); } return g; };
  if (zoneAt(mTop).warm>.02 || zoneAt(mBot).warm>.02 || zoneAt((mTop+mBot)/2).warm>.02){
    ctx.globalCompositeOperation="soft-light"; ctx.fillStyle=og(z=>`rgba(255,150,60,${z.warm*0.85})`); ctx.fillRect(0,0,W,H);
  }
  if (zoneAt(mTop).sep>.02 || zoneAt(mBot).sep>.02 || zoneAt((mTop+mBot)/2).sep>.02){
    ctx.globalCompositeOperation="color"; ctx.fillStyle=og(z=>`rgba(150,112,64,${z.sep*0.9})`); ctx.fillRect(0,0,W,H);
  }
  ctx.globalCompositeOperation="multiply";
  ctx.fillStyle=og(z=>{ const d=z.dark; return `rgb(${lerp(255,36,d)|0},${lerp(255,46,d)|0},${lerp(255,88,d)|0})`; });
  ctx.fillRect(0,0,W,H);
  // cloud shadows drifting over daytime zones
  if (!reduce) for (let i=0;i<4;i++){
    const x=((T*14 + i*430) % (W+700)) - 350, y=((i*290 + T*5) % (H+500)) - 250, z=zoneAt((y+camTop)/K);
    const a=0.16*(1-z.dark); if (a<.02) continue;
    stamp("40,50,70", x, y, 220, 220, a);
  }
  // lights (screen blend)
  ctx.globalCompositeOperation="screen";
  for (const L of LIGHTS){
    if (L[0]==="cone"){
      const [,x,y,a,d]=L; ctx.save(); ctx.translate(x,y); ctx.rotate(a);
      const g=ctx.createLinearGradient(0,10,0,240); g.addColorStop(0,`rgba(255,236,190,${.55*d})`); g.addColorStop(1,"rgba(255,236,190,0)");
      ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(-6,P*7); ctx.quadraticCurveTo(-60,140,-90,240); ctx.lineTo(90,240); ctx.quadraticCurveTo(60,140,6,P*7); ctx.closePath(); ctx.fill();
      stamp("255,200,120", 0, 0, 46, 46, .35*d);
      ctx.restore(); continue;
    }
    const [x,y,r,col,a]=L; if (a<=0.01) continue;
    stamp(col, x, y, r, r, a);
    if (r<14){ ctx.fillStyle=`rgba(${col},${Math.min(1,a)})`; ctx.fillRect(x-1,y-1,2,2); }
  }
  ctx.globalCompositeOperation="source-over";

  // mist in the Green Hell
  if (!reduce) for (let i=0;i<3;i++){
    const y=((i*260 + T*8) % (H+300)) - 150, z=zoneAt((y+camTop)/K); if (z.mist<.1) continue;
    const x=W/2 + Math.sin(T*.15+i*2)*W*.3;
    stamp("200,215,220", x, y, W*.5, W*.5*.35, .12*z.mist);
  }
  // heat shimmer over the salt
  if (!reduce && (zoneAt((camTop+H/2)/K).salt>.5 || zoneAt((camTop+H/2)/K).sand>.5)){
    ctx.strokeStyle="rgba(255,255,255,.07)"; ctx.lineWidth=2;
    for (let i=0;i<6;i++){ const y=((i*H/6 + T*20)%H); ctx.beginPath(); for (let x=0;x<=W;x+=20){ const yy=y+Math.sin(x/40+T*3+i)*3; x?ctx.lineTo(x,yy):ctx.moveTo(x,yy);} ctx.stroke(); }
  }

  // weather: rain, snow, falling leaves (screen space, per-row zone intensity)
  if (!reduce) WX.forEach(w=>{
    const z=zoneAt((w.y+camTop)/K), a=z[w.k]; if (a<.15) return;
    if (w.k==="rain"){ ctx.strokeStyle=`rgba(190,210,235,${.45*a})`; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(w.x,w.y); ctx.lineTo(w.x-4,w.y+16); ctx.stroke(); }
    else if (w.k==="snow"){ ctx.fillStyle=`rgba(255,255,255,${.9*a})`; const sz=w.s; ctx.fillRect(w.x,w.y,sz,sz); }
    else { ctx.fillStyle=`rgba(${w.c},${a})`; ctx.save(); ctx.translate(w.x,w.y); ctx.rotate(Math.sin(t*3+w.ph)*1.2); ctx.fillRect(-3,-1.5,6,3); ctx.restore(); }
  });
  // the car itself, in full colour (it pops even in the sepia stretch)
  ctx.save(); ctx.translate(carX, carY+idleBob); ctx.rotate(ang);
  const dark = zoneAt(cm).dark;
  ctx.fillStyle="rgba(0,0,0,.35)"; ctx.beginPath(); ctx.ellipse(2,4,SPR.car.w*.55,SPR.car.h*.5,0,0,Math.PI*2); ctx.fill();
  if (dark>.05) ctx.filter=`brightness(${1-dark*0.35})`;
  ctx.drawImage(SPR.car, -SPR.car.w/2|0, -SPR.car.h/2|0, SPR.car.w, SPR.car.h);
  ctx.filter="none";
  if (dark>.3){ ctx.fillStyle="#ff3b30"; ctx.fillRect(-1, -SPR.car.h/2-1, 2, 2); }
  ctx.restore();

  // sky traffic: birds by day, a TV helicopter now and then
  if (!reduce){
    const bp = (T % 22)/22, zmid = zoneAt((camTop+H*.3)/K);
    if (zmid.dark < .3 && bp < .7){
      const bx = -60 + bp/0.7*(W+120), by = H*0.18 + Math.sin(T*.4)*30;
      ctx.strokeStyle="rgba(20,24,32,.75)"; ctx.lineWidth=1.6;
      for (let i=0;i<5;i++){ const ox=bx - i*14 - (i%2)*6, oy=by + Math.abs(i-2)*9; const f=Math.sin(T*9+i)*3; ctx.beginPath(); ctx.moveTo(ox-6,oy-f); ctx.quadraticCurveTo(ox-3,oy-2,ox,oy); ctx.quadraticCurveTo(ox+3,oy-2,ox+6,oy-f); ctx.stroke(); }
    }
    const hp = (T % 38)/38;
    if (hp < .45){
      const u=hp/.45, hx=-80+u*(W+160), hy=H*0.55 - u*H*0.35;
      ctx.fillStyle="rgba(0,0,0,.25)"; ctx.beginPath(); ctx.ellipse(hx+40, hy+60, 14, 6, 0, 0, Math.PI*2); ctx.fill();
      ctx.save(); ctx.translate(hx,hy); ctx.rotate(Math.PI/2 - 0.5);
      ctx.drawImage(SPR.heli, -SPR.heli.w/2|0, -SPR.heli.h/2|0, SPR.heli.w, SPR.heli.h);
      ctx.strokeStyle="rgba(220,225,235,.75)"; ctx.lineWidth=1.5; const ra=T*40;
      for (let k=0;k<2;k++){ const a=ra+k*Math.PI/2; ctx.beginPath(); ctx.moveTo(Math.cos(a)*22, -P*2+Math.sin(a)*22); ctx.lineTo(-Math.cos(a)*22, -P*2-Math.sin(a)*22); ctx.stroke(); }
      ctx.restore();
    }
  }
}

/* ---------- loop ---------- */
const HUD = {od:"", zn:""}, odoEl = document.getElementById("odo"), zoneEl = document.getElementById("zone");
let lastT = performance.now(), puffClock = 0;
const ticks = new Set();
function frame(now){
  const dt = Math.min(0.05,(now-lastT)/1000); lastT=now;
  const t = reduce ? 0 : now/1000;
  const prev = car.shown;
  if (reduce) car.shown = car.target;
  else {
    const diff = car.target - car.shown;
    if (Math.abs(diff) < 0.5) car.shown = car.target;
    else car.shown += diff*Math.min(1,dt*2.4) + Math.sign(diff)*dt*24;
    if ((diff>0&&car.shown>car.target)||(diff<0&&car.shown<car.target)) car.shown = car.target;
  }
  const moving = car.shown !== prev;
  // exhaust: gentle idle puffs, a stream when driving
  if (!reduce && window.__car){
    puffClock -= dt;
    if (puffClock <= 0){
      const c = window.__car, rx = c.x - c.fwd[0]*P*7.5, ry = c.y - c.fwd[1]*P*7.5;
      puffs.push({x:rx+(Math.random()-.5)*4, y:ry, vx:-c.fwd[0]*(moving?60:14)+(Math.random()-.5)*10, vy:-c.fwd[1]*(moving?60:14)+(Math.random()-.5)*6, r:1.5, life:1, a:moving?.45:.3});
      puffClock = moving ? 0.03 : 0.32;
    }
  }
  const camShift = (car.shown - prev)*K;
  for (let i=puffs.length-1;i>=0;i--){ const p=puffs[i]; p.x+=p.vx*dt; p.y+=p.vy*dt - camShift; p.r+=dt*7; p.life-=dt*1.4; if (p.life<=0) puffs.splice(i,1); }
  if (!reduce) stepWX(dt, now, camShift);
  if (moving) crossFacts(prev, car.shown);
  render(t);
  const od = Math.round(car.shown).toLocaleString(), zn = zoneAt(car.shown).name;
  if (od !== HUD.od){ HUD.od = od; odoEl.textContent = od; }
  if (zn !== HUD.zn){ HUD.zn = zn; zoneEl.textContent = zn; }
  ticks.forEach(fn=>fn(now));
  requestAnimationFrame(frame);
}

/* answer input with lenient autocorrect */
function wireInput(p, onLock, onMiss){
  const form=document.getElementById("form"), input=document.getElementById("ans"), sg=document.getElementById("sg");
  let pending=null, pendingText="";
  const hide = () => { sg.hidden=true; pending=null; };
  input.addEventListener("input", () => { if (pending && input.value.trim()!==pendingText) hide(); });
  form.onsubmit = e => {
    e.preventDefault();
    const v = input.value.trim(); if (!v) return;
    if (pending && v===pendingText){ const a=pending; hide(); return onLock(a, v, "suggest"); }
    const r = match(p, v);
    if (!r){ logMiss(p, v); hide(); form.classList.remove("shake"); void form.offsetWidth; form.classList.add("shake"); onMiss(v); input.select(); return; }
    if (r.how==="suggest"){
      pending=r.a; pendingText=v;
      sg.innerHTML = `<span>Did you mean <b>${esc(r.a.display)}</b>?</span><button class="mini yes" type="button" id="sg-yes">Yes, lock it</button><button class="mini no" type="button" id="sg-no">No</button><span style="color:var(--dust);font-size:18px">Enter also confirms</span>`;
      sg.hidden=false;
      document.getElementById("sg-yes").onclick = () => { const a=pending; hide(); onLock(a, v, "suggest"); };
      document.getElementById("sg-no").onclick = () => { hide(); input.select(); input.focus(); };
      return;
    }
    hide(); onLock(r.a, v, r.how);
  };
}

/* ---------- games: daily and unlimited share one 7-prompt flow ---------- */
let G = null;
const UNL = {deck:[], count:0, lapped:false};
/* ---------- seen-prompt cache: unlimited plays every prompt once before anything repeats ---------- */
const pkey = p => { const s = norm(p.q); let h = 2166136261; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h>>>0).toString(36); };
const seenOwner = () => ACCT.uid || (ACCT.user && typeof ACCT.user.id === "string" ? ACCT.user.id : "guest");
const seenKey = () => "carrillion-seen-" + seenOwner();
let SEEN = null, SEEN_OWNER = null;
function seenState(){
  if (SEEN_OWNER !== seenOwner()){
    SEEN_OWNER = seenOwner(); const v = store.get(seenKey());
    SEEN = {lap:(v && v.lap)|0, k:new Set(v && Array.isArray(v.k) ? v.k : [])};
  }
  return SEEN;
}
const seenData = () => { const s = seenState(); return {lap:s.lap, k:[...s.k].slice(-1500)}; };
function seenSave(){ store.set(seenKey(), seenData()); }
function seenAdopt(v){   // merge a copy from the account: a newer lap wins, the same lap combines
  if (!v || !Array.isArray(v.k)) return;
  const s = seenState(), lap = v.lap|0;
  if (lap > s.lap){ s.lap = lap; s.k = new Set(v.k.map(String)); }
  else if (lap === s.lap) v.k.forEach(x => s.k.add(String(x)));
  seenSave();
}
function markSeen(p){ const s = seenState(), k = pkey(p); if (!s.k.has(k)){ s.k.add(k); seenSave(); } }
const unplayed = () => { const s = seenState(); return PROMPTS.filter(p => !s.k.has(pkey(p))).length; };
function drawSeven(){
  const s = seenState(), today = new Set(dailySet().map(pkey));
  const order = pool => shuffle(pool.filter(p => !today.has(pkey(p))), Math.random).concat(shuffle(pool.filter(p => today.has(pkey(p))), Math.random));  // today's daily prompts go last
  const out = order(PROMPTS.filter(p => !s.k.has(pkey(p)))).slice(0, DAILY_N);
  UNL.lapped = false;
  if (out.length < DAILY_N){   // every prompt has been played: start a fresh lap through the deck
    UNL.lapped = PROMPTS.length > DAILY_N;
    s.lap++; s.k.clear(); seenSave();
    const have = new Set(out.map(pkey));
    out.push(...order(PROMPTS.filter(p => !have.has(pkey(p)))).slice(0, DAILY_N - out.length));
  }
  while (out.length < DAILY_N && PROMPTS.length) out.push(PROMPTS[Math.floor(Math.random()*PROMPTS.length)]);   // only on a sheet with fewer than 7 prompts
  return out;
}
const findPrompt = q => PROMPTS.find(p=>p.q===q) || {q, c:"", mode:"manual", tiers:[[],[],[],[],[]]};
function startDaily(){
  clearTick(); setNav("nav-daily"); setLap("Daily #"+DAY); rewind(); applySheet();

}

const pips = () => `<div class="pips">${G.prompts.map((_,k)=> k<G.results.length ? `<span class="pip" style="background:${tierOf(G.results[k]).c}"></span>` : `<span class="pip${k===G.i?" now":""}"></span>`).join("")}</div>`;
function gamePrompt(){
  clearTick();
  const p = G.prompts[G.i]; markSeen(p);
  swap(`<section class="px">

async function finishGame(){

function driveLog(results){
  const Wd=600, Hd=200, L=46, R=16, Tp=14, B=30, n=results.length;
  let cum=0; const pts=[[0,0]]; results.forEach((r,i)=>{ cum+=tierOf(r).m; pts.push([i+1,cum]); });
  const maxY = Math.max(400, Math.ceil(cum/400)*400);
  const X = i => L + i*(Wd-L-R)/n, Y = v => Hd-B - v*(Hd-B-Tp)/maxY;
  let d=`M${X(0)},${Y(0)}`;
  for (let i=1;i<pts.length;i++){ const [x0,y0]=[X(pts[i-1][0]),Y(pts[i-1][1])], [x1,y1]=[X(pts[i][0]),Y(pts[i][1])], xm=(x0+x1)/2; d+=` C${xm},${y0} ${xm},${y1} ${x1},${y1}`; }
  const area = d + ` L${X(n)},${Y(0)} L${X(0)},${Y(0)} Z`;
  const cs = getComputedStyle(document.documentElement);
  const ticksY=[0,maxY/2,maxY].map(v=>`<line x1="${L}" x2="${Wd-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#3b3a2c" stroke-dasharray="3 5"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" fill="#b3b0a0" font-family="VT323, monospace" font-size="16">${v.toLocaleString()}</text>`).join("");
  const ticksX=pts.slice(1).map(([i])=>`<text x="${X(i)}" y="${Hd-8}" text-anchor="middle" fill="#b3b0a0" font-family="VT323, monospace" font-size="16">${i}</text>`).join("");
  const marks=pts.slice(1).map(([i,v],k)=>{ const t=tierOf(results[k]), col=cs.getPropertyValue(t.c.slice(4,-1)).trim()||"#ccc"; return `<rect x="${X(i)-6}" y="${Y(v)-6}" width="12" height="12" fill="${col}" stroke="#18191b" stroke-width="3" shape-rendering="crispEdges"/>`; }).join("");
  return `<svg class="log" viewBox="0 0 ${Wd} ${Hd}" role="img" aria-label="Distance after each prompt">
    <defs><linearGradient id="lg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#c9b77e" stop-opacity=".35"/><stop offset="1" stop-color="#c9b77e" stop-opacity="0"/></linearGradient></defs>
    ${ticksY}<path d="${area}" fill="url(#lg)"/><path d="${d}" fill="none" stroke="#c9b77e" stroke-width="2.5"/>${marks}${ticksX}
  </svg>`;
}

  box.innerHTML = `<div class="shead"><span>#</span><span>Prompt</span><span>Answers</span><span>Gem</span></div>` + rows.map(r=>{
    const n = r.t.reduce((s,x)=>s+countAns(x),0) + (r.g?1:0);
    return `<div class="srow${sheetOpen===r.id?" open":""}" data-id="${esc(r.id)}"><button type="button" class="shit"><span>${(r.order??0)+1}</span><span><b>${esc(r.q)}</b><small>${esc(r.c)} · ${esc(r.mode)}</small></span><span>${n}</span><span>${esc((r.g||"").split("|")[0])}</span></button>${sheetOpen===r.id?editorHTML(r):""}</div>`;
  }).join("");
  box.querySelectorAll(".shit").forEach(b=>b.onclick = () => { const id=b.parentElement.dataset.id; sheetOpen = sheetOpen===id?null:id; renderSheetList(); });
  if (sheetOpen) wireEditor(sheetOpen);
}
function editorHTML(r){
  const names = ["Stock","Street","Track","Works"];
  return `<div class="sedit">
    <div class="sgrid">
      <label>Category<input id="e-c" value="${esc(r.c)}"></label>
      <label>Scoring<select id="e-m">${["manual","hybrid","mechanical"].map(m=>`<option${m===r.mode?" selected":""}>${m}</option>`).join("")}</select></label>
      <label class="wide">Prompt<input id="e-q" value="${esc(r.q)}"></label>
      ${names.map((n,i)=>`<label class="wide" style="--c:var(--t${i})"><span class="tn">${n} · +${TIERS[i].m} m</span><textarea id="e-t${i}" rows="3">${esc(r.t[i])}</textarea></label>`).join("")}
      <label class="wide" style="--c:var(--t4)"><span class="tn">One in a Car-rillion · +400 m (one answer, aliases allowed)</span><input id="e-g" value="${esc(r.g)}"></label>
    </div>
    <div class="cta"><button class="btn go" id="e-save" type="button">Save to site</button><button class="btn ghost" id="e-del" type="button">Delete prompt</button><button class="btn ghost" id="e-close" type="button">Close</button><span id="e-confirm"></span></div>
  </div>`;
}
function wireEditor(id){
  const r = SHEET_ROWS.find(x=>x.id===id); if (!r) return;
  document.getElementById("e-close").onclick = () => { sheetOpen=null; renderSheetList(); };
  document.getElementById("e-save").onclick = async () => {
    const row = {id:r.id, order:r.order, c:document.getElementById("e-c").value.trim(), q:document.getElementById("e-q").value.trim(), mode:document.getElementById("e-m").value,
      t:[0,1,2,3].map(i=>document.getElementById("e-t"+i).value.replace(/\s*\n\s*/g,", ").trim()), g:document.getElementById("e-g").value.trim()};
    if (!row.q || !row.g){ sfb("A prompt needs its question and a car-rillion answer.", true); return; }
    await pushRows([row], "Saving");
  };
  document.getElementById("e-del").onclick = () => {
    const c = document.getElementById("e-confirm");
    c.innerHTML = `Delete for every player? <button class="mini yes" id="e-yes" type="button">Delete</button> <button class="mini no" id="e-no" type="button">Keep</button>`;
    document.getElementById("e-no").onclick = () => c.innerHTML = "";
    document.getElementById("e-yes").onclick = async () => {
      if (!sb){ sfb("The database isn't connected, so nothing was deleted.", true); return; }
      const {error} = await sb.from("prompts").delete().eq("id", r.id);
      if (error){ sfb("Couldn't delete that prompt. Only editors can change the sheet.", true); return; }
      SHEET_ROWS = SHEET_ROWS.filter(x=>x.id!==r.id); pendingSheet = SHEET_ROWS; if (!G || G.done) applySheet(); sheetOpen=null; renderSheetList(); sfb("Deleted. It's gone from the next game.");
    };
  };
}
async function pushRows(rows, verb){
  if (!sb){ sfb("The database isn't connected, so nothing was saved.", true); return false; }
  for (let i=0;i<rows.length;i+=50){
    const {error} = await sb.from("prompts").upsert(rows.slice(i,i+50).map(toDb));
    if (error){ sfb(`Stopped after ${i} of ${rows.length}. Only editors can change the sheet.`, true); return false; }
    sfb(`${verb}… ${Math.min(i+50,rows.length)}/${rows.length}`);
  }
  sfb(rows.length===1 ? "Saved. Live for every player's next game." : `${verb} done: ${rows.length} prompts are live.`);
  await loadSheet();
  return true;
}
function loadXLSX(){
  return new Promise((res, rej) => {
    if (window.XLSX) return res(window.XLSX);
    const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = () => res(window.XLSX); s.onerror = () => rej(new Error("load")); document.head.appendChild(s);
  });
}
async function downloadXLSX(){
  sfb("Building the workbook…");
  try {
    const X = await loadXLSX();
    const aoa = [SHEET_COLS].concat(SHEET_ROWS.map(r=>[r.id, (r.order??0)+1, r.c, r.q, r.mode, r.t[0], r.t[1], r.t[2], r.t[3], r.g]));
    const ws = X.utils.aoa_to_sheet(aoa);
    ws["!cols"] = [{wch:10},{wch:6},{wch:14},{wch:52},{wch:11},{wch:60},{wch:60},{wch:60},{wch:60},{wch:28}];
    const help = X.utils.aoa_to_sheet([["How to edit"],["Separate answers with commas. Put aliases after a | (Wrist pin|gudgeon pin|piston pin)."],["Start an answer with ! to mark it too clever (it scores as Street)."],["Scoring is mechanical, hybrid or manual. It is shown to players with the answers."],["Keep the ID column. Rows with a new or blank ID are added as new prompts."],["Upload the file on the Answer sheet tab, check the summary, then push it to the site."]]);
    help["!cols"]=[{wch:100}];
    const wb = X.utils.book_new(); X.utils.book_append_sheet(wb, ws, "Prompts"); X.utils.book_append_sheet(wb, help, "How to edit");
    const buf = X.write(wb, {bookType:"xlsx", type:"array"});
    const url = URL.createObjectURL(new Blob([buf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
    const a = document.createElement("a"); a.href = url; a.download = "car-rillion-answer-sheet.xlsx"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    sfb("Downloaded car-rillion-answer-sheet.xlsx.");
  } catch(e){ sfb("Couldn't build the workbook here.", true); }
}
async function importXLSX(file){
  sfb("Reading "+file.name+"…");
  try {
    const X = await loadXLSX();
    const wb = X.read(await file.arrayBuffer(), {type:"array"});
    const ws = wb.Sheets["Prompts"] || wb.Sheets[wb.SheetNames[0]];
    const aoa = X.utils.sheet_to_json(ws, {header:1, defval:""});
    const head = (aoa[0]||[]).map(h=>String(h).trim().toLowerCase());
    const col = name => head.indexOf(name.toLowerCase());
    const ci = {id:col("ID"), order:col("Order"), c:col("Category"), q:col("Prompt"), m:col("Scoring"), g:col("One in a Car-rillion")};
    const tc = ["Stock","Street","Track","Works"].map(col);
    if (ci.q<0 || tc.some(x=>x<0)){ sfb("That file needs Prompt, Stock, Street, Track and Works columns. Download the sheet first to get the layout.", true); return; }
    const byId = new Map(SHEET_ROWS.map(r=>[r.id,r]));
    const changed=[], added=[];
    aoa.slice(1).forEach((row,i)=>{
      const q = String(row[ci.q]||"").trim(); if (!q) return;
      let id = ci.id>=0 ? String(row[ci.id]||"").trim() : "";
      const r = {id: id || ("p"+Date.now().toString(36)+i), order: ci.order>=0 && row[ci.order]!=="" ? Number(row[ci.order])-1 : SHEET_ROWS.length+added.length,
        c: ci.c>=0 ? String(row[ci.c]).trim() : "", q, mode: ci.m>=0 && ["manual","hybrid","mechanical"].includes(String(row[ci.m]).trim()) ? String(row[ci.m]).trim() : "manual",
        t: tc.map(k=>String(row[k]||"").trim()), g: ci.g>=0 ? String(row[ci.g]).trim() : ""};
      const old = id && byId.get(id);
      if (!old) added.push(r);
      else if (old.q!==r.q || old.c!==r.c || old.mode!==r.mode || old.g!==r.g || old.order!==r.order || old.t.some((x,k)=>x!==r.t[k])) changed.push(r);
    });
    const box = document.getElementById("import");
    if (!changed.length && !added.length){ box.innerHTML=""; sfb("No differences from the live sheet."); return; }
    box.innerHTML = `<div class="imp"><b>${changed.length} changed · ${added.length} new</b><span>${changed.concat(added).slice(0,8).map(r=>esc(r.q)).join(" · ")}${changed.length+added.length>8?" …":""}</span><span>Prompts missing from the file stay as they are.</span><div class="cta"><button class="btn go" id="imp-go" type="button">Push ${changed.length+added.length} to the site</button><button class="btn ghost" id="imp-no" type="button">Cancel</button></div></div>`;
    sfb("");
    document.getElementById("imp-no").onclick = () => box.innerHTML = "";
    document.getElementById("imp-go").onclick = async () => { const ok = await pushRows(changed.concat(added), "Pushing"); if (ok) box.innerHTML = ""; };
  } catch(e){ sfb("Couldn't read that file. Upload an .xlsx saved from the answer sheet.", true); }
}

/* ---------- how to + FAQ ---------- */
function showHow(){
  clearTick(); setNav("nav-how");
  swap(`<section class="px how">
    <div class="eyebrow">How to play</div>
    <h2>Drive deep, not obvious</h2>
    <ol>
      <li>Each prompt asks you to name something from the car world: engine parts, units, racing history, songs, films, places.</li>
      <li>Keep guessing until an answer is accepted. Typos, plurals and British spellings are forgiven. If you're a little further off, you'll get a “Did you mean…?”.</li>
      <li>You only see your tier as you play: Stock 40 m, Street 120 m, Track 240 m, Works 340 m. Every accepted answer is revealed at the end.</li>
      <li>Each prompt hides one <span style="color:var(--t4)">One in a Car-rillion</span> answer worth 400 m.</li>
      <li>Every game is seven prompts. Daily is the same seven for everyone today. Unlimited deals a fresh seven every game, as many games as you like.</li>
      <li>If time runs out or you skip, the car stays put and the next prompt comes up.</li>
      <li>Every game pays its points into your garage. Spend them on new cars, and your all-time points go on the leaderboard.</li>
      <li>The scenery changes every 300 m. Between 1,886 m and 2,026 m the track turns sepia and the distance is the year.</li>
    </ol>
    <h2 style="margin-top:22px">FAQ</h2>
    <div class="faq">
      <h3>How are answer sets curated?</h3>
      <p>Each prompt pulls from whatever the question calls for: engineering references, rulebooks, race records, discographies, filmographies and atlases. They're merged into one list per prompt, ${TOTAL_ANS.toLocaleString()} answers in all, and editors keep them in a live answer sheet that also downloads as Excel.</p>
      <h3>How is rarity decided?</h3>
      <p>Prompts made of everyday technical words are scored against a familiarity database of how often a word turns up in what people read and write. Names, titles, places and eponyms don't reduce to a number, so they get an AI-assisted manual pass. Many prompts blend both.</p>
      <h3>Why is the car-rillion sometimes less rare than a Works answer?</h3>
      <p>Past a certain depth rarity is hard to tell apart, so the gem is also picked for fun: the answer that's most satisfying to land, and one a few of you actually get.</p>
      <h3>Why wasn't my answer listed?</h3>
      <p>It was missed. Guesses that don't count are collected at the end of each game so they can be added.</p>
      <h3>Why does autocorrect sometimes surprise me?</h3>
      <p>Answers carry aliases, and autocorrect checks all of them. It ignores plurals, British spellings, word order and filler words, accepts one distinctive word ("Helio"), and accepts a guess that contains a full answer. A letter or two off an alias can match something you weren't expecting.</p>
      <h3>What is "too clever"?</h3>
      <p>The go-to "obscure" pick that isn't actually that obscure, like Desmodromic for valvetrains. It scores as Street.</p>
      <h3>Where are my points kept?</h3>
      <p>With an account, your points, cars and best daily follow you to any device and your name goes on the leaderboard. As a guest they stay in this browser.</p>
    </div>
    <div class="cta" style="margin-top:18px"><button class="btn go" id="h1">Start today's drive</button><button class="btn ghost" id="h2">∞ Unlimited</button></div>
  </section>`);
  document.getElementById("h1").onclick = startDaily;
  document.getElementById("h2").onclick = startUnlimited;
}
